services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: reportes_presentacion
      POSTGRES_USER: reportes_app
      POSTGRES_PASSWORD: demo-local-only
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes_app -d reportes_presentacion"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - reportes-db:/var/lib/postgresql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: reportes_presentacion
      PGUSER: reportes_app
      PGPASSWORD: demo-local-only
    volumes:
      - ./data/reports:/app/data/reports

volumes:
  reportes-db:
